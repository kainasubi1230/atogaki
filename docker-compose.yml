services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-handwriting}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@postgres:5432/handwriting}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_INLINE: "${RQ_INLINE:-false}"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio123}
      S3_BUCKET: ${S3_BUCKET:-handwriting}
      S3_REGION: ${S3_REGION:-ap-northeast-1}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      INFERENCE_ONLY: "${INFERENCE_ONLY:-false}"
      SHARED_STYLE_ID: "${SHARED_STYLE_ID:-0}"
      BASE_MODEL_PATH: ${BASE_MODEL_PATH:-./storage/models/base_model.pt}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@postgres:5432/handwriting}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_INLINE: "${RQ_INLINE:-false}"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio123}
      S3_BUCKET: ${S3_BUCKET:-handwriting}
    command: ["python", "api/worker_main.py"]
    depends_on:
      - postgres
      - redis
      - minio

  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@postgres:5432/handwriting}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_INLINE: "${RQ_INLINE:-false}"
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minio123}
      S3_BUCKET: ${S3_BUCKET:-handwriting}
    depends_on:
      - postgres
      - redis
      - minio

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  minio:
